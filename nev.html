<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Navbar Only</title>
    <!-- link css -->
     <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شريط التنقل فقط -->
    <div class="navbar-container">
        <nav class="navbar" aria-label="التنقل الرئيسي">
            <!-- المؤشر السائل -->
            <div class="liquid-indicator" id="indicator" aria-hidden="true"></div>

            <a class="nav-item active" href="index.html" aria-current="page">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>الرئيسية</span>
            </a>

            <a class="nav-item" href="A3.html">
                <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                <span>فكرة موقع</span>
            </a>

            <a class="nav-item" href="A1.html">
                <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
                <span>تسجيل الدخول</span>
            </a>
        </nav>
    </div>

    <script>
        const navItems = [...document.querySelectorAll('.nav-item')];
        const indicator = document.getElementById('indicator');
        const navbar = document.querySelector('.navbar');
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';

        function moveIndicator(element) {
            if (!element || !navbar || !indicator) return;

            const rect = element.getBoundingClientRect();
            const navRect = navbar.getBoundingClientRect();
            const leftPosition = rect.left - navRect.left;

            indicator.style.width = `${rect.width}px`;
            indicator.style.left = `${leftPosition}px`;
        }

        function setActiveItem(target) {
            navItems.forEach(item => {
                const isActive = item === target;
                item.classList.toggle('active', isActive);
                item.setAttribute('aria-current', isActive ? 'page' : 'false');
            });
        }

        function animateIndicatorTo(target) {
            setActiveItem(target);
            indicator.classList.remove('stretching');
            void indicator.offsetWidth;
            indicator.classList.add('stretching');

            setTimeout(() => {
                indicator.classList.remove('stretching');
            }, 400);

            moveIndicator(target);
        }

        navItems.forEach(item => {
            const href = item.getAttribute('href');
            if (href === currentPage) {
                item.classList.add('active');
            }

            item.addEventListener('click', function (event) {
                const targetHref = this.getAttribute('href');
                if (!targetHref || targetHref === currentPage) return;

                event.preventDefault();
                animateIndicatorTo(this);

                setTimeout(() => {
                    window.location.href = targetHref;
                }, 350);
            });
        });

        function syncIndicatorOnLoad() {
            const activeItem = document.querySelector('.nav-item.active') || navItems[0];
            if (!activeItem) return;

            indicator.style.transition = 'none';
            moveIndicator(activeItem);

            setTimeout(() => {
                indicator.style.transition = 'all 0.7s cubic-bezier(0.25, 1, 0.5, 1)';
            }, 50);
        }

        window.addEventListener('DOMContentLoaded', syncIndicatorOnLoad);
        window.addEventListener('resize', () => {
            const activeItem = document.querySelector('.nav-item.active') || navItems[0];
            moveIndicator(activeItem);
        });
    </script>
</body>
</html>
